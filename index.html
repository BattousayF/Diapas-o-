/* ---------------------------------------------------------------
   Storage helpers
----------------------------------------------------------------*/

const STORAGE_PREFIX = "diapasao:";

async function loadKey(key, fallback) {
  try {
    const raw = window.localStorage.getItem(STORAGE_PREFIX + key);
    if (raw === null) return fallback;
    return JSON.parse(raw);
  } catch (e) {
    return fallback;
  }
}

async function saveKey(key, value) {
  try {
    window.localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value));
    return true;
  } catch (e) {
    console.error("Erro ao salvar (armazenamento cheio?)", key, e);
    return false;
  }
}

function exportBackup() {
  const data = {};
  for (let i = 0; i < window.localStorage.length; i++) {
    const k = window.localStorage.key(i);
    if (k && k.startsWith(STORAGE_PREFIX)) {
      data[k.slice(STORAGE_PREFIX.length)] = JSON.parse(window.localStorage.getItem(k));
    }
  }
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `diapasao-backup-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importBackup(file, onDone) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      Object.entries(data).forEach(([k, v]) => {
        window.localStorage.setItem(STORAGE_PREFIX + k, JSON.stringify(v));
      });
      onDone(true);
    } catch (err) {
      console.error("Backup inválido", err);
      onDone(false);
    }
  };
  reader.readAsText(file);
}

function compressImage(file, maxDim = 900, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new window.Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) {
          height = Math.round((height * maxDim) / width);
          width = maxDim;
        } else if (height > maxDim) {
          width = Math.round((width * maxDim) / height);
          height = maxDim;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => resolve(e.target.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function formatDate(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  return `${d}/${m}/${y}`;
}

    width: size, height: size, viewBox: "0 0 24 24", fill, stroke: color,
    strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round", style,

      return <svg {...common}><polyline points="15 18 9 12 15 6" /></svg>;

   Waveform signature — used as divider / header texture

function Waveform({ className = "", color = "#B8874F", opacity = 1 }) {
  return (
    <svg
      viewBox="0 0 400 40"
      className={className}
      preserveAspectRatio="none"
      style={{ opacity }}
    >
      <path
        d="M0,20 C10,20 12,4 22,4 C32,4 34,36 44,36 C54,36 56,10 66,10 C76,10 78,30 88,30 C98,30 100,20 110,20 L140,20 C150,20 152,2 162,2 C172,2 174,38 184,38 C194,38 196,14 206,14 C216,14 218,26 228,26 C238,26 240,20 250,20 L400,20"
        fill="none"
        stroke={color}
        strokeWidth="1.4"
        vectorEffect="non-scaling-stroke"
      />
    </svg>
  );
}

/* ---------------------------------------------------------------
   Main App
----------------------------------------------------------------*/

function App() {
  const [view, setView] = useState("list");
  const [instruments, setInstruments] = useState(null);
  const [selectedId, setSelectedId] = useState(null);
  const [initError, setInitError] = useState(false);

  useEffect(() => {
    (async () => {
      const stored = await loadKey("instruments-list", null);
      if (stored) {
        setInstruments(stored);
      } else {
        setInstruments(SEED_INSTRUMENTS);
        await saveKey("instruments-list", SEED_INSTRUMENTS);
        // seed frequency histories for the instruments we have real data for
        for (const [id, entries] of Object.entries(SEED_FREQ)) {
          await saveKey(`freq:${id}`, entries);
        }
      }
    })().catch(() => setInitError(true));
  }, []);

  const selected = instruments?.find((i) => i.id === selectedId) || null;

  const openInstrument = (id) => {
    setSelectedId(id);
    setView("detail");
  };
  const backToList = () => {
    setView("list");
    setSelectedId(null);
  };

  return (
    <div
      style={{
        minHeight: "100vh",
        background: "#F1E9D8",
        fontFamily: FONT_BODY,
        color: "#1C1410",
      }}
    >
      <link rel="stylesheet" href={GOOGLE_FONTS_URL} />
      <style>{`
        * { box-sizing: border-box; }
        ::selection { background: #B8874F; color: #F1E9D8; }
        .serif { font-family: ${FONT_DISPLAY}; }
        .mono { font-family: ${FONT_MONO}; }
        .card-hover { transition: transform .18s ease, box-shadow .18s ease; }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(36,24,17,0.12); }
        .fade-in { animation: fadeIn .25s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px);} to { opacity: 1; transform: translateY(0);} }
        button { font-family: inherit; cursor: pointer; }
        input, select, textarea { font-family: inherit; }
        @media (prefers-reduced-motion: reduce) {
          .card-hover, .fade-in { animation: none !important; transition: none !important; }
        }
      `}</style>

      {initError && (
        <div style={{ padding: 40, textAlign: "center", color: "#7A3B2E" }}>
          <Icon name="alertCircle" size={28} />
          <p>Não foi possível carregar os dados. Recarregue a página.</p>
        </div>
      )}

      {!initError && instruments === null && (
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", height: "100vh" }}>
          <Icon name="loader2" size={28} color="#B8874F" style={{ animation: "spin 1s linear infinite" }} />
          <style>{`@keyframes spin { to { transform: rotate(360deg); } }`}</style>
        </div>
      )}

      {!initError && instruments !== null && view === "list" && (
        <ListView instruments={instruments} onOpen={openInstrument} />
      )}

      {!initError && instruments !== null && view === "detail" && selected && (
        <DetailView instrument={selected} onBack={backToList} />
      )}
    </div>
  );
}

      >
        <Icon name="download" size={13} /> Exportar backup
      </button>
      <input
        ref={fileInputRef}
        type="file"
        accept="application/json"
        style={{ display: "none" }}
        onChange={(e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          importBackup(file, (ok) => {
            setMsg(ok ? "Restaurado! Recarregando..." : "Arquivo inválido.");

          });
        }}
      />
      <button
        onClick={() => fileInputRef.current?.click()}
        style={{
          display: "flex", alignItems: "center", gap: 6, background: "none", border: "1px solid #DFC49A",
          borderRadius: 8, padding: "8px 12px", fontSize: 12.5, color: "#7A6A56",
        }}
      >
        <Icon name="upload" size={13} /> Restaurar backup
      </button>
      {msg && <span className="mono" style={{ fontSize: 11, color: "#B8874F" }}>{msg}</span>}
    </div>
  );

/* ---- Destino / ownership tracking ---- */

const STATUS_OPTIONS = ["Em produção", "Disponível", "Reservado", "Vendido"];

const STATUS_COLORS = {
  "Em produção": "#9C8B6F",
  "Disponível": "#3D5A5B",
  "Reservado": "#B8874F",
  "Vendido": "#7A3B2E",
};

function DestinoBlock({ instrumentId }) {
  const [destino, setDestino] = useState(null);
  const [saved, setSaved] = useState(false);
  const saveTimer = useRef(null);

  useEffect(() => {
    loadKey(`destino:${instrumentId}`, { status: "Em produção", quemFicou: "", notas: "" }).then(setDestino);
  }, [instrumentId]);

  const update = (patch) => {
    const updated = { ...destino, ...patch };
    setDestino(updated);
    setSaved(false);
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(async () => {
      await saveKey(`destino:${instrumentId}`, updated);
      setSaved(true);
    }, 500);
  };

  if (destino === null) return null;

  const inputStyle = {
    width: "100%",
    padding: "9px 10px",
    borderRadius: 7,
    border: "1px solid #DFC49A",
    background: "#fff",
    fontSize: 13.5,
    color: "#241811",
  };
  const labelStyle = { fontSize: 11.5, color: "#7A6A56", marginBottom: 4, display: "block" };

  return (
    <div style={{ background: "#FBF7EE", border: "1px solid #DFC49A", borderRadius: 10, padding: 16, marginBottom: 14 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
        <span style={{ fontSize: 12, color: "#7A6A56", fontWeight: 600, letterSpacing: "0.03em" }}>DESTINO</span>
        {saved && <span className="mono" style={{ fontSize: 10, color: "#9C8B6F" }}>salvo</span>}
      </div>

      <div style={{ marginBottom: 12 }}>
        <label style={labelStyle}>Status</label>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
          {STATUS_OPTIONS.map((s) => (
            <button
              key={s}
              onClick={() => update({ status: s })}
              style={{
                padding: "7px 12px",
                borderRadius: 20,
                border: `1px solid ${destino.status === s ? STATUS_COLORS[s] : "#DFC49A"}`,
                background: destino.status === s ? STATUS_COLORS[s] : "#fff",
                color: destino.status === s ? "#F1E9D8" : "#7A6A56",
                fontSize: 12.5,
              }}
            >
              {s}
            </button>
          ))}
        </div>
      </div>

      {(destino.status === "Vendido" || destino.status === "Reservado") && (
        <div style={{ marginBottom: 12 }}>
          <label style={labelStyle}>
            {destino.status === "Vendido" ? "Quem ficou com o instrumento" : "Reservado para"}
          </label>
          <input
            type="text"
            placeholder="Nome da pessoa ou loja..."
            value={destino.quemFicou}
            onChange={(e) => update({ quemFicou: e.target.value })}
            style={inputStyle}
          />
        </div>
      )}

      <div>
        <label style={labelStyle}>Observações (opcional)</label>
        <textarea
          rows={2}
          placeholder="Cidade, contato, condições da venda..."
          value={destino.notas}
          onChange={(e) => update({ notas: e.target.value })}
          style={{ ...inputStyle, resize: "vertical" }}
        />
      </div>
    </div>
  );
}

/* ---- Photos tab ---- */

function PhotosTab({ instrumentId }) {
  const [photos, setPhotos] = useState(null);
  const [uploading, setUploading] = useState(false);
  const [viewerIdx, setViewerIdx] = useState(null);
  const fileInputRef = useRef(null);

  useEffect(() => {
    loadKey(`photos:${instrumentId}`, []).then(setPhotos);
  }, [instrumentId]);

  const handleFiles = async (files) => {
    if (!files || !files.length) return;
    setUploading(true);
    const newPhotos = [];
    for (const file of Array.from(files)) {
      if (!file.type.startsWith("image/")) continue;
      try {
        const dataUrl = await compressImage(file);
        newPhotos.push({
          id: `p${Date.now()}${Math.random().toString(36).slice(2, 6)}`,
          dataUrl,
          caption: "",
          date: new Date().toISOString().slice(0, 10),
        });
      } catch (e) {
        console.error("Falha ao processar imagem", e);
      }
    }
    const updated = [...newPhotos, ...(photos || [])];
    setPhotos(updated);
    await saveKey(`photos:${instrumentId}`, updated);
    setUploading(false);
  };

  const removePhoto = async (id) => {
    const updated = photos.filter((p) => p.id !== id);
    setPhotos(updated);
    await saveKey(`photos:${instrumentId}`, updated);
    setViewerIdx(null);
  };

  if (photos === null) return <LoadingBlock />;

  return (
    <div>
      <input
        ref={fileInputRef}
        type="file"
        accept="image/*"
        multiple
        style={{ display: "none" }}
        onChange={(e) => handleFiles(e.target.files)}
      />
      <button
        onClick={() => fileInputRef.current?.click()}
        disabled={uploading}
        style={{
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          gap: 8,
          width: "100%",
          padding: "14px",
          background: "#241811",
          color: "#F1E9D8",
          border: "none",
          borderRadius: 10,
          fontSize: 14,
          fontWeight: 500,
          marginBottom: 16,
          opacity: uploading ? 0.6 : 1,
        }}
      >
        {uploading ? <Icon name="loader2" size={16} style={{ animation: "spin 1s linear infinite" }} /> : <Icon name="plus" size={16} />}
        {uploading ? "Processando..." : "Adicionar fotos"}
      </button>

      {photos.length === 0 ? (
        <EmptyState text="Nenhuma foto ainda. Adicione fotos do instrumento, do tampo, da caixa aberta — o que for relevante para acompanhar a construção." />
      ) : (
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 8 }}>
          {photos.map((p, idx) => (
            <button
              key={p.id}
              onClick={() => setViewerIdx(idx)}
              style={{
                aspectRatio: "1",
                borderRadius: 8,
                overflow: "hidden",
                border: "1px solid #DFC49A",
                padding: 0,
                background: `url(${p.dataUrl}) center/cover`,
              }}
            />
          ))}
        </div>
      )}

      {viewerIdx !== null && photos[viewerIdx] && (
        <PhotoViewer
          photo={photos[viewerIdx]}
          onClose={() => setViewerIdx(null)}
          onDelete={() => removePhoto(photos[viewerIdx].id)}
        />
      )}
    </div>
  );
}

function PhotoViewer({ photo, onClose, onDelete }) {
  return (
    <div

/* ---- Frequency tab ---- */

function FreqTab({ instrumentId }) {
  const [entries, setEntries] = useState(null);
  const [showForm, setShowForm] = useState(false);

  useEffect(() => {
    loadKey(`freq:${instrumentId}`, []).then((e) =>
      setEntries(e.sort((a, b) => a.date.localeCompare(b.date)))
    );
  }, [instrumentId]);

  const addEntry = async (entry) => {
    const updated = [...(entries || []), { ...entry, id: `f${Date.now()}` }].sort((a, b) =>
      a.date.localeCompare(b.date)
    );
    setEntries(updated);
    await saveKey(`freq:${instrumentId}`, updated);
    setShowForm(false);
  };

  const removeEntry = async (id) => {
    const updated = entries.filter((e) => e.id !== id);
    setEntries(updated);
    await saveKey(`freq:${instrumentId}`, updated);
  };

  if (entries === null) return <LoadingBlock />;

  const components = [...new Set(entries.map((e) => e.component))];
  const dates = [...new Set(entries.map((e) => e.date))].sort();
  const chartData = dates.map((date) => {
    const row = { date: formatDate(date) };
    components.forEach((c) => {
      const match = entries.find((e) => e.date === date && e.component === c);
      if (match) row[c] = match.freqHz;
    });
    return row;
  });

  return (
    <div>
      <button
        onClick={() => setShowForm((s) => !s)}
        style={{
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          gap: 8,
          width: "100%",
          padding: "14px",
          background: showForm ? "#DFC49A" : "#241811",
          color: showForm ? "#241811" : "#F1E9D8",
          border: "none",
          borderRadius: 10,
          fontSize: 14,
          fontWeight: 500,
          marginBottom: 16,
        }}
      >
        {showForm ? <Icon name="x" size={16} /> : <Icon name="plus" size={16} />}
        {showForm ? "Cancelar" : "Nova medição"}
      </button>

      {showForm && <FreqForm onSubmit={addEntry} />}

      {entries.length === 0 ? (
        <EmptyState text="Nenhuma medição registrada. Adicione as frequências do tampo, fundo e caixa fechada ao longo da construção para acompanhar a evolução." />
      ) : (
        <>
          {chartData.length > 1 && (
            <div style={{ background: "#FBF7EE", border: "1px solid #DFC49A", borderRadius: 10, padding: "16px 8px 8px", marginBottom: 20 }}>
              <ResponsiveContainer width="100%" height={220}>
                <LineChart data={chartData} margin={{ top: 4, right: 12, left: -18, bottom: 0 }}>
                  <CartesianGrid stroke="#EADFC5" vertical={false} />
                  <XAxis dataKey="date" tick={{ fontSize: 11, fill: "#7A6A56" }} axisLine={{ stroke: "#DFC49A" }} tickLine={false} />
                  <YAxis tick={{ fontSize: 11, fill: "#7A6A56" }} axisLine={false} tickLine={false} unit="Hz" />
                  <Tooltip
                    contentStyle={{ background: "#241811", border: "none", borderRadius: 8, fontSize: 12 }}
                    labelStyle={{ color: "#DFC49A" }}
                    itemStyle={{ color: "#F1E9D8" }}
                  />
                  <Legend wrapperStyle={{ fontSize: 11 }} />
                  {components.map((c) => (
                    <Line
                      key={c}
                      type="monotone"
                      dataKey={c}
                      stroke={COMPONENT_COLORS[c] || "#B8874F"}
                      strokeWidth={2}
                      dot={{ r: 3 }}
                      connectNulls
                    />
                  ))}
                </LineChart>
              </ResponsiveContainer>
            </div>
          )}

          <div style={{ display: "grid", gap: 8 }}>
            {[...entries].reverse().map((e) => (
              <FreqRow key={e.id} entry={e} onDelete={() => removeEntry(e.id)} />
            ))}
          </div>
        </>
      )}

      <CertificatesSection instrumentId={instrumentId} />
    </div>
  );
}

/* ---- Certificates ---- */

function CertificatesSection({ instrumentId }) {
  const [certs, setCerts] = useState(null);
  const [uploading, setUploading] = useState(false);
  const fileInputRef = useRef(null);

  useEffect(() => {
    loadKey(`certs:${instrumentId}`, []).then(setCerts);
  }, [instrumentId]);

  const handleFiles = async (files) => {
    if (!files || !files.length) return;
    setUploading(true);
    const additions = [];
    for (const file of Array.from(files)) {
      const okType = file.type === "application/pdf" || file.type.startsWith("image/");
      if (!okType) continue;
      try {
        const dataUrl = await readFileAsDataUrl(file);
        additions.push({
          id: `c${Date.now()}${Math.random().toString(36).slice(2, 6)}`,
          fileName: file.name,
          mimeType: file.type,
          dataUrl,
          date: new Date().toISOString().slice(0, 10),
          isFinal: false,
        });
      } catch (e) {
        console.error("Falha ao anexar certificado", e);
      }
    }
    const updated = [...additions, ...(certs || [])];
    const ok = await saveKey(`certs:${instrumentId}`, updated);
    if (ok) setCerts(updated);
    setUploading(false);
  };

  const removeCert = async (id) => {
    const updated = certs.filter((c) => c.id !== id);
    setCerts(updated);
    await saveKey(`certs:${instrumentId}`, updated);
  };

  const toggleFinal = async (id) => {
    const updated = certs.map((c) => ({ ...c, isFinal: c.id === id ? !c.isFinal : c.isFinal }));
    setCerts(updated);
    await saveKey(`certs:${instrumentId}`, updated);
  };

  if (certs === null) return null;

  return (
    <div style={{ marginTop: 28 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10 }}>
        <Icon name="fileText" size={16} color="#B8874F" />
        <h3 className="serif" style={{ fontSize: 17, fontWeight: 600, margin: 0, color: "#241811" }}>
          Certificados
        </h3>
      </div>

      <input
        ref={fileInputRef}
        type="file"
        accept="application/pdf,image/*"
        multiple
        style={{ display: "none" }}
        onChange={(e) => handleFiles(e.target.files)}
      />
      <button
        onClick={() => fileInputRef.current?.click()}
        disabled={uploading}
        style={{
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          gap: 8,
          width: "100%",
          padding: "12px",
          background: "#fff",
          color: "#241811",
          border: "1px solid #DFC49A",
          borderRadius: 10,
          fontSize: 13.5,
          fontWeight: 500,
          marginBottom: 12,
          opacity: uploading ? 0.6 : 1,
        }}
      >
        {uploading ? <Icon name="loader2" size={15} style={{ animation: "spin 1s linear infinite" }} /> : <Icon name="plus" size={15} />}
        {uploading ? "Salvando..." : "Anexar certificado (PDF ou foto)"}
      </button>

      {certs.length === 0 ? (
        <EmptyState text="Nenhum certificado salvo ainda. Anexe o PDF gerado no medidor quando fechar a caixa ou finalizar o instrumento." />
      ) : (
        <div style={{ display: "grid", gap: 8 }}>
          {certs.map((c) => (
            <div
              key={c.id}
              style={{
                display: "flex",
                alignItems: "center",
                gap: 10,
                background: "#FBF7EE",
                border: c.isFinal ? "1px solid #B8874F" : "1px solid #DFC49A",
                borderRadius: 10,
                padding: "10px 12px",
              }}
            >
              <div
                style={{
                  width: 34,
                  height: 34,
                  borderRadius: 7,
                  background: "#EADFC5",
                  display: "flex",
                  alignItems: "center",
                  justifyContent: "center",
                  flexShrink: 0,
                }}
              >
                <Icon name="fileText" size={16} color="#B8874F" />
              </div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 13, color: "#241811", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                  {c.fileName}
                </div>
                <div className="mono" style={{ fontSize: 10.5, color: "#9C8B6F" }}>
                  {formatDate(c.date)} {c.isFinal && "· FINAL"}
                </div>
              </div>
              <button
                onClick={() => toggleFinal(c.id)}
                title="Marcar como certificado final"
                style={{ background: "none", border: "none", padding: 4, color: c.isFinal ? "#B8874F" : "#DFC49A" }}
              >
                <Icon name="star" size={16} fill={c.isFinal ? "#B8874F" : "none"} />
              </button>
              <a
                href={c.dataUrl}
                download={c.fileName}
                style={{ background: "none", border: "none", padding: 4, color: "#7A6A56", display: "flex" }}
              >
                <Icon name="download" size={16} />
              </a>
              <button onClick={() => removeCert(c.id)} style={{ background: "none", border: "none", padding: 4, color: "#B8a084" }}>
                <Icon name="trash2" size={14} />
              </button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function FreqRow({ entry, onDelete }) {
  const color = COMPONENT_COLORS[entry.component] || "#B8874F";
  return (
    <div
      style={{
        display: "flex",
        alignItems: "center",
        gap: 12,
        background: "#FBF7EE",
        border: "1px solid #DFC49A",
        borderRadius: 10,
        padding: "12px 14px",
      }}
    >
      <div style={{ width: 4, alignSelf: "stretch", background: color, borderRadius: 2 }} />
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
          <span style={{ fontSize: 13.5, fontWeight: 600, color: "#241811" }}>{entry.component}</span>
          {entry.type === "alvo" && (
            <span className="mono" style={{ fontSize: 10, color: "#B8874F", border: "1px solid #B8874F", borderRadius: 4, padding: "1px 5px" }}>
              ALVO
            </span>
          )}
        </div>
        {entry.notes && <div style={{ fontSize: 12.5, color: "#7A6A56", marginTop: 2 }}>{entry.notes}</div>}
        <div className="mono" style={{ fontSize: 11, color: "#9C8B6F", marginTop: 3 }}>
          {formatDate(entry.date)}
        </div>
      </div>
      <div className="mono" style={{ fontSize: 18, fontWeight: 500, color: "#241811", whiteSpace: "nowrap" }}>
        {entry.freqHz}<span style={{ fontSize: 12, color: "#9C8B6F" }}>Hz</span>
      </div>
      <button onClick={onDelete} style={{ background: "none", border: "none", color: "#B8a084", padding: 4 }}>
        <Icon name="trash2" size={14} />
      </button>
    </div>
  );
}

function FreqForm({ onSubmit }) {
  const [date, setDate] = useState(new Date().toISOString().slice(0, 10));
  const [component, setComponent] = useState(COMPONENT_OPTIONS[0]);
  const [freqHz, setFreqHz] = useState("");
  const [type, setType] = useState("medido");
  const [notes, setNotes] = useState("");

  const submit = () => {
    if (!freqHz || isNaN(parseFloat(freqHz))) return;
    onSubmit({ date, component, freqHz: parseFloat(freqHz), type, notes });
    setFreqHz("");
    setNotes("");
  };

  const inputStyle = {
    width: "100%",
    padding: "9px 10px",
    borderRadius: 7,
    border: "1px solid #DFC49A",
    background: "#fff",
    fontSize: 13.5,
    color: "#241811",
  };
  const labelStyle = { fontSize: 11.5, color: "#7A6A56", marginBottom: 4, display: "block" };

  return (
    <div style={{ background: "#FBF7EE", border: "1px solid #DFC49A", borderRadius: 10, padding: 16, marginBottom: 16, display: "grid", gap: 12 }}>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        <div>
          <label style={labelStyle}>Data</label>
          <input type="date" value={date} onChange={(e) => setDate(e.target.value)} style={inputStyle} />
        </div>
        <div>
          <label style={labelStyle}>Frequência (Hz)</label>
          <input
            type="number"
            step="0.1"
            placeholder="ex: 174.7"
            value={freqHz}
            onChange={(e) => setFreqHz(e.target.value)}
            style={inputStyle}
          />
        </div>
      </div>
      <div>
        <label style={labelStyle}>Componente medido</label>
        <select value={component} onChange={(e) => setComponent(e.target.value)} style={inputStyle}>
          {COMPONENT_OPTIONS.map((c) => (
            <option key={c} value={c}>{c}</option>
          ))}
        </select>
      </div>
      <div>
        <label style={labelStyle}>Tipo</label>
        <div style={{ display: "flex", gap: 8 }}>
          {["medido", "alvo"].map((t) => (
            <button
              key={t}
              onClick={() => setType(t)}
              style={{
                flex: 1,
                padding: "8px",
                borderRadius: 7,
                border: `1px solid ${type === t ? "#241811" : "#DFC49A"}`,
                background: type === t ? "#241811" : "#fff",
                color: type === t ? "#F1E9D8" : "#7A6A56",
                fontSize: 12.5,
                textTransform: "capitalize",
              }}
            >
              {t}
            </button>
          ))}
        </div>
      </div>
      <div>
        <label style={labelStyle}>Notas (opcional)</label>
        <textarea
          value={notes}
          onChange={(e) => setNotes(e.target.value)}
          rows={2}
          placeholder="Contexto da medição..."
          style={{ ...inputStyle, resize: "vertical" }}
        />
      </div>
      <button
        onClick={submit}
        style={{
          padding: "11px",
          background: "#B8874F",
          color: "#241811",
          border: "none",
          borderRadius: 8,
          fontWeight: 600,
          fontSize: 13.5,
        }}
      >
        Salvar medição
      </button>
    </div>
  );
}

/* ---- shared ---- */

function EmptyState({ text }) {
  return (
    <div style={{ textAlign: "center", padding: "36px 20px", color: "#9C8B6F", fontSize: 13.5, border: "1px dashed #DFC49A", borderRadius: 10 }}>
      {text}
    </div>
  );
}

function LoadingBlock() {
  return (
    <div style={{ display: "flex", justifyContent: "center", padding: 40 }}>
      <Icon name="loader2" size={20} color="#B8874F" style={{ animation: "spin 1s linear infinite" }} />
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
